<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d" />
      <stop offset="100%" stop-color="#0d192e" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Lira Gradient -->
    <linearGradient id="liraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Trend Line / Candlestick Emerald Gradient -->
    <linearGradient id="growthGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Cyan Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Background Financial Grid Lines -->
  <line x1="12" y1="24" x2="52" y2="24" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2" />
  <line x1="12" y1="36" x2="52" y2="36" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2" />
  <line x1="12" y1="48" x2="52" y2="48" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2" />

  <!-- Ascending Candlesticks (Financial Market Bars) -->
  <!-- Candle 1 (Middle) -->
  <line x1="36" y1="27" x2="36" y2="44" stroke="#0ea5e9" stroke-width="1.2" stroke-linecap="round" />
  <rect x="34" y="31" width="4" height="9" rx="1" fill="#0ea5e9" />

  <!-- Candle 2 (Right-Middle) -->
  <line x1="43" y1="20" x2="43" y2="39" stroke="#10b981" stroke-width="1.2" stroke-linecap="round" />
  <rect x="41" y="24" width="4" height="11" rx="1" fill="#10b981" />

  <!-- Candle 3 (Right) -->
  <line x1="50" y1="16" x2="50" y2="35" stroke="#34d399" stroke-width="1.2" stroke-linecap="round" />
  <rect x="48" y="20" width="4" height="11" rx="1" fill="#34d399" />

  <!-- Stylized Turkish Lira Sign (₺) -->
  <!-- Vertical Stem with bottom curve -->
  <path d="M 22 14 L 22 41 Q 22 47 28 47 L 34 47" 
        fill="none" 
        stroke="url(#liraGrad)" 
        stroke-width="3.8" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Double Crossbars (Ascending Tilted Bars of ₺) -->
  <line x1="14" y1="24" x2="32" y2="18" stroke="url(#liraGrad)" stroke-width="3.2" stroke-linecap="round" />
  <line x1="14" y1="31" x2="32" y2="25" stroke="url(#liraGrad)" stroke-width="3.2" stroke-linecap="round" />

  <!-- Surging Trend Line with Glow -->
  <path d="M 12 45 L 20 37 L 29 41 L 46 17" 
        fill="none" 
        stroke="url(#lineGrad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)" />
  
  <!-- Sharp Arrowhead at (46, 17) pointing to top-right corner (53, 10) -->
  <polygon points="42,13 53,10 50,21" fill="#34d399" filter="url(#neonGlow)" />
</svg>