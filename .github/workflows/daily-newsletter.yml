name: Gunluk Canli Bulten Otomatik Gonder (10:30 TSI)

on:
  schedule:
    # Hafta ici her gun 07:30 UTC = 10:30 TSI (Seans baslangici sonrasi canli seans verileri)
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
  repository_dispatch:
    types: [send_newsletter]

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Paketleri Kur
        run: npm ci || npm install

      - name: Guncel Verileri Cek
        run: node fetch-data.js

      - name: Canli Bulteni Gonder
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_RECIPIENT: ${{ secrets.NEWSLETTER_RECIPIENT }}
        run: node send-newsletter.js