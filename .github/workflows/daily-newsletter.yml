name: Gunluk Piyasa Bulteni Otomatik Gonder (12:00 TSI)

on:
  schedule:
    # Her gun 09:00 UTC = 12:00 Turkiye saati
    - cron: '0 9 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [send_newsletter]

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Paketleri Kur
        run: npm ci || npm install

      - name: Guncel Verileri Cek
        run: node fetch-data.js
        env:
          TEFAS_HISTORY_MODE: latest

      - name: Guncel Piyasa Bultenini Gonder
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_RECIPIENT: ${{ secrets.NEWSLETTER_RECIPIENT }}
        run: node send-newsletter.js